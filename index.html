:root{--bg:#0a0908;--panel:#14100e;--line:#3b2e24;--red:#8e0f1b;--red2:#c4202f;--gold:#c9a24a;--gray:#8d8a86;--fg:#ece6da;color-scheme:dark}
*{font-family:'MF',Tahoma,Arial,sans-serif}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font-size:17px;line-height:1.7;background:radial-gradient(ellipse at 50% 0,#2a0b10 0,var(--bg) 62%) fixed,var(--bg);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:44px;text-align:center;margin:6px 0;color:var(--gold);letter-spacing:2px;font-weight:400}
h2{font-size:22px;color:var(--gold);margin:8px 0;text-align:center;font-weight:400}
.c{text-align:center}.dim{color:var(--gray)}.gold{color:var(--gold)}.red{color:var(--red2)}
.ic{width:1em;height:1em;vertical-align:-.14em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--fg);background:#1a1411;border:1px solid #5c4932;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:16px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--gold)}button:active{background:var(--gold);color:#000}button:disabled{opacity:.4;cursor:default}
button.main{display:flex;width:100%;margin:10px 0;padding:12px;font-size:18px;background:linear-gradient(180deg,#b01d2c,var(--red));border-color:#d04050;color:#fff;letter-spacing:.5px}
button.sel{background:var(--gold);border-color:var(--gold);color:#120d08}
input[type=text],input[type=number]{width:100%;box-sizing:border-box;background:#0d0a09;color:var(--fg);border:1px solid #4a3a2c;border-radius:8px;padding:10px;text-align:center;font-size:17px}
input:focus{outline:none;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}.row label{flex:1}
.av{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-size:14px;color:#f3e9d4;border:1px solid #6a5238;vertical-align:middle;flex:none}
.pl{display:flex;align-items:center;gap:10px;padding:5px 6px;border-bottom:1px dashed var(--line)}.pl.dead{opacity:.4;text-decoration:line-through}.pl.now{background:#2a1a12;border-radius:6px;color:var(--gold)}
.code{font-size:40px;letter-spacing:8px;text-align:center;color:var(--gold);direction:ltr}
.tm{font-size:34px;text-align:center;color:var(--gold);direction:ltr}.tm.t2{font-size:26px}
.moon{font-size:76px;text-align:center;animation:pulse 3s ease-in-out infinite;color:var(--gold)}
@keyframes pulse{50%{transform:scale(1.07);opacity:.75}}
.big{font-size:24px;text-align:center;margin:12px 0}
.lg{font-size:15px;border-bottom:1px dashed var(--line);padding:4px 0}
.logo{width:100%;display:block;margin:6px 0}

  const idx=rot=>`<g ${rot?'transform="rotate(180 100 140)"':''}><text x="24" y="38" font-size="32" font-weight="700" text-anchor="middle" fill="${c}" font-family="Georgia,serif">${o.r}</text><use href="#s${S}" x="14" y="44" width="20" height="20" fill="${c}"/></g>`;

  };

  else if(o.r==='A')mid=`<use href="#s${S}" x="42" y="82" width="116" height="116" fill="${c}"/>`;
  else mid=`<rect x="40" y="50" width="120" height="180" fill="#fbf3dc" stroke="${c}" stroke-width="1.500"/><g>${half()}</g><g transform="rotate(180 100 140)">${half()}</g><line x1="40" y1="140" x2="160" y2="140" stroke="${c}"/>`;

function creepy(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),t=a.currentTime;[[110,.0],[82,.35],[55,.8]].forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+d);o.frequency.exponentialRampToValueAtTime(f/2,t+d+1.2);g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.35,t+d+.1);g.gain.exponentialRampToValueAtTime(.0001,t+d+1.3);o.connect(g).connect(a.destination);o.start(t+d);o.stop(t+d+1.4)})}catch(e){}}

async function init(){
  try{
    const t=setTimeout(()=>{if(!db)app.innerHTML='<h1>المافيا</h1><p class="c dim">ما قدرنا نتصل. تأكد من الإنترنت ومن تفعيل Anonymous Auth في Firebase.</p>'},10000);
    const cred=await signInAnonymously(auth);
    clearTimeout(t);uid=cred.user.uid;db=makeDb();
    $('sd').innerHTML=ic('send');$('mc').innerHTML=ic('mic');$('sd').onclick=sendText;$('mc').onclick=mic;$('ci').onkeydown=e=>{if(e.key==='Enter')sendText()};
    try{G.saved=localStorage.getItem('mf_room')||''}catch(e){}
    render();setInterval(clock,1000);
  }catch(e){app.innerHTML='<h1>المافيا</h1><p class="c dim">تعذّر الاتصال: '+esc(e.message||e)+'</p>'}
}
function err(m){G.err=m;render()}
function go(s){G.step=s;G.err='';render()}
async function create(){
  const n=G.name.trim(),code=G.cc.trim().toUpperCase().replace(/[^A-Z0-9\u0600-\u06FF]/g,'');
  if(!n)return err('اكتب اسمك أولاً');if(code.length<3)return err('اكتب رمزاً للغرفة (3 أحرف أو أرقام على الأقل)');
  try{
    const s=await db.doc('rooms/'+code).get();
    if(s.exists){if(Date.now()-(s.data().ts||0)>6*3600e3)await purge(code);else return err('هذا الرمز مستخدم حالياً، اختر رمزاً آخر')}
    await db.doc('rooms/'+code).set({code,host:uid,ph:'lobby',round:0,gid:Date.now(),ts:Date.now(),set:{...G.opt}});
    await enter(code);
  }catch(e){err('تعذّر إنشاء الغرفة: '+(e.code||e.message))}
}
async function resume(){await enter(G.saved)}
async function joinRoom(){
  if(!G.name.trim())return err('اكتب اسمك أولاً');
  if(!G.join.trim())return err('اكتب رمز الغرفة');
  await enter(G.join.trim().toUpperCase().replace(/[^A-Z0-9\u0600-\u06FF]/g,''));
}
async function enter(code,silent){
  try{
    const s=await db.doc('rooms/'+code).get();
    if(!s.exists){if(!silent)err('الرمز غير صحيح');return}
    const r=s.data();
    if(r.ph!=='lobby'&&!ids(r).includes(uid)){if(!silent)err('الغرفة مغلقة واللعبة بدأت');return}
    await db.doc(`players/${code}_${uid}`).set({room:code,id:uid,name:G.name.trim()});
    sv('mf_name',G.name.trim());sv('mf_room',code);
    G.code=code;G.err='';subscribe(code);
  }catch(e){if(!silent)err('تعذّر الانضمام: '+(e.code||e.message))}
}
function subscribe(code){
  unsub();G.seen=new Set();$('cl').innerHTML='';wasAlive=null;
  un.push(db.doc('rooms/'+code).onSnapshot(s=>{G.room=s.exists?s.data():null;tick()}));
  un.push(db.collection('players').where('room','==',code).onSnapshot(q=>{const p={};q.docs.forEach(d=>{const x=d.data();p[x.id]=x});G.pl=p;tick()}));
  un.push(db.collection('acts').where('room','==',code).onSnapshot(q=>{G.acts=q.docs.map(d=>d.data());tick()}));
  un.push(db.collection('msgs').where('room','==',code).onSnapshot(q=>{
    const l=q.docs.map(d=>({k:d.id,...d.data()})).filter(x=>!G.seen.has(x.k)).sort((a,b)=>a.ts-b.ts),b=$('cl');
    l.forEach(x=>{G.seen.add(x.k);const body=x.t?esc(x.t):(String(x.a||'').startsWith('data:audio')?`<audio controls preload="none" src="${x.a}"></audio>`:'');
      b.insertAdjacentHTML('beforeend',`<div class="m ${x.id===uid?'me':''}"><b>${avs(x.name,x.id)} ${esc(x.name||'')}</b>${body}</div>`)});
    if(l.length)b.scrollTop=b.scrollHeight}));
}
function unsub(){un.forEach(f=>{try{f()}catch(e){}});un=[]}
async function purge(code){
  await db.doc('rooms/'+code).delete().catch(()=>{});
  for(const c of ['players','acts','msgs']){
    try{const q=await db.collection(c).where('room','==',code).get();await Promise.all(q.docs.map(d=>db.doc(c+'/'+d.id).delete()))}catch(e){}
  }
}
function leave(){
  const R=G.room,code=G.code;
  if(R&&code&&db){
    if(R.ph==='lobby'&&R.host===uid)purge(code);
    else if(R.ph==='lobby'||R.ph==='end')db.doc(`players/${code}_${uid}`).delete().catch(()=>{});
  }
  unsub();G.code=null;G.room=null;G.pl={};G.acts=[];done='';G.step='choice';G.saved='';sv('mf_room','');render()
}

  if(!isHost()||!confirm('إنهاء الغرفة نهائياً؟ سيتم إلغاؤها ويمكن استخدام الرمز مجدداً.'))return;
  const code=G.code;await purge(code);leave();
}

}

function chatState(){
  const R=G.room,el=$('chat');
  if(!G.code||!R||!G.pl[uid]){el.hidden=true;return}
  const tk=R.ph==='talk',df=R.ph==='defend',cur=(R.tord||[])[R.turn||0];
  el.hidden=!(R.ph==='lobby'||((tk||df)&&R.alive&&R.alive[uid]));
  const mt=(tk&&cur!==uid)||(df&&R.acc!==uid);
  $('ci').disabled=mt;$('sd').disabled=mt;$('mc').disabled=mt;
  if(mt&&rec)rec.stop();
  $('ci').placeholder=tk&&mt?'ليس دورك الآن، استمع':df&&mt?'المتهم يبرر نفسه…':tk?'دورك: تكلّم أو اكتب':'اكتب رسالة…';
}

  const R=G.room;if(!R||$('chat').hidden||$('ci').disabled)return;
  try{await db.doc(`msgs/${G.code}_${Date.now()}_${uid}`).set({room:G.code,id:uid,name:nm(uid),ts:Date.now(),...p})}catch(e){err('تعذّر إرسال الرسالة')}
}

  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));
    rec=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000});chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{clearTimeout(rt);st.getTracks().forEach(t=>t.stop());const ty=rec.mimeType||mt||'audio/webm';rec=null;$('mc').innerHTML=ic('mic');
      const f=new FileReader();f.onload=()=>{if(f.result.length<900000)sendMsg({a:f.result})};f.readAsDataURL(new Blob(chunks,{type:ty}))};
    rec.start();$('mc').innerHTML=ic('stop');rt=setTimeout(()=>{if(rec)rec.stop()},20000);
  }catch(e){alert('تعذّر الوصول للميكروفون. اسمح للمتصفح باستخدامه.')}
}

/* ---------- actions ---------- */
async function act(stage,patch){
  const d={...getAct(uid,stage),room:G.code,id:uid,stage,g:gidOf(),...patch};
  G.acts=G.acts.filter(a=>!(a.id===uid&&a.stage===stage)).concat(d);render();
  try{await db.doc(`acts/${G.code}_${uid}_${stage}`).set(d)}catch(e){}
}
function stageOf(R){const r=R.round;return R.ph==='vote'?R.vstage:R.ph==='night1'?'n'+r:R.ph==='night2'?'m'+r:'b'+r}
function pickT(field,id){act(stageOf(G.room),{[field]:id})}
async function upd(p){try{await db.doc('rooms/'+G.code).update(p)}catch(e){}}
function startGame(){
  const R=G.room,order=Object.keys(G.pl),n=order.length,s=R.set;
  if(n<4){G.err='العدد غير كافٍ: يلزم 4 لاعبين على الأقل';render();return}
  G.err='';
  let m=Math.max(1,s.m),sh=!!s.sh;
  while((m+(sh?1:0))*2>=n){if(m>1)m--;else if(sh)sh=false;else break}
  let rl=[...Array(m).fill('mafia'),...(sh?['sheikh']:[]),'girl',...(s.cs?['csheikh']:[]),...(s.boy?['boy']:[])].slice(0,n);
  while(rl.length<n)rl.push('citizen');shuffle(rl);
  const roles={},al={};order.forEach((i,k)=>{roles[i]=rl[k];al[i]=true});
  done='';upd({ph:'closed',order,roles,alive:al,round:1,log:[],muted:null,shot:null,until:Date.now()+4500});
}

/* ---------- host engine ---------- */
function winner(roles,al){
  const A=Object.keys(al).filter(i=>al[i]),m=A.filter(i=>isM(roles[i])).length;
  if(m===0)return 'citizens';if(m>=A.length-m)return 'mafia';return null;
}
const plur=v=>{const c={};v.filter(Boolean).forEach(k=>c[k]=(c[k]||0)+1);const mx=Math.max(0,...Object.values(c)),t=Object.keys(c).filter(k=>c[k]===mx);return t.length?t:[]};
async function dawn(R,kill,prot,mute,now){
  const died=kill&&kill!==prot?kill:null,al={...R.alive};if(died)al[died]=false;
  const log=[...(R.log||[]),{r:R.round,k:died?'kill':kill?'fail':'none',id:died||kill||null}];
  await upd({ph:'dawn',kill:kill||null,prot:prot||null,mute:mute||null,died:died||null,alive:al,log,muted:mute||null,until:now+13000});
}
const tp=(R,al,mu,now)=>({until:now+TALK,tord:shuffle(ids(R).filter(i=>al[i]&&i!==mu)),turn:0,tuntil:now+30000});
async function finishVote(R,el,now){
  const al={...R.alive};if(el)al[el]=false;
  const log=el?[...R.log,{r:R.round,k:'out',id:el}]:R.log,w=winner(R.roles,al);
  await upd({ph:w?'end':'result',alive:al,log,elim:el||null,win:w||null,until:now+8000,acc:null,prev:null,cands:null,vn:0});
}
function revote(){const R=G.room,vn=(R.vn||0)+1;upd({ph:'vote',vstage:'v'+R.round+'_'+vn,vn,prev:R.acc,cands:null,until:Date.now()+NIGHT})}
async function engine(){
  const R=G.room;if(!R||!isHost()||busy||R.ph==='lobby'||R.ph==='end')return;
  const key=R.ph+R.round+(R.vstage||'')+R.until;if(done===key)return;
  const now=Date.now(),A=alive(R),rd=R.round;
  busy=true;
  try{
    if(R.ph==='closed'&&now>=R.until){done=key;await upd({ph:'roles',until:now+15000})}
    else if(R.ph==='roles'&&now>=R.until){done=key;await upd({ph:'talk',first:true,...tp(R,R.alive,null,now)})}
    else if(R.ph==='talk'&&now>=R.until){done=key;
      if(R.first)await upd({ph:'night1',first:false,start:now,until:now+NIGHT,muted:null,shot:null});
      else await upd({ph:'vote',vstage:'v'+rd,vn:0,prev:null,cands:null,acc:null,muted:null,until:now+NIGHT})}
    else if(R.ph==='talk'&&R.tord&&now>=(R.tuntil||0)){await upd({turn:((R.turn||0)+1)%R.tord.length,tuntil:now+30000})}
    else if(R.ph==='night1'){
      const st='n'+rd,mt=A.filter(i=>isM(R.roles[i])),g=A.find(i=>R.roles[i]==='girl'),c=A.find(i=>R.roles[i]==='csheikh'),v=mt.map(i=>getAct(i,st).kill);
      if((v.every(Boolean)&&(!g||getAct(g,st).prot)&&(!c||getAct(c,st).ask)&&now-R.start>=6000)||now>=R.until){
        done=key;const tp=plur(v),kill=tp.length?tp[Math.floor(Math.random()*tp.length)]:null,prot=g?(getAct(g,st).prot||null):null;
        if(A.some(i=>R.roles[i]==='sheikh'))await upd({ph:'night2',kill,prot,start:now,until:now+NIGHT});
        else await dawn(R,kill,prot,null,now);
      }}
    else if(R.ph==='night2'){
      const sh=A.find(i=>R.roles[i]==='sheikh'),m=sh?getAct(sh,'m'+rd).mute:null;
      if(m||now>=R.until){done=key;await dawn(R,R.kill,R.prot,m,now)}}
    else if(R.ph==='dawn'&&now>=R.until){
      done=key;
      if(R.died&&R.roles[R.died]==='boy')await upd({ph:'boy',until:now+30000});
      else{const w=winner(R.roles,R.alive);await upd(w?{ph:'end',win:w}:{ph:'talk',...tp(R,R.alive,R.muted,now)})}}
    else if(R.ph==='boy'){
      const t=getAct(R.died,'b'+rd).shoot;
      if(t||now>=R.until){done=key;const al={...R.alive};let shot=null;if(t&&al[t]){al[t]=false;shot=t}
        const log=shot?[...R.log,{r:rd,k:'shot',id:shot}]:R.log,w=winner(R.roles,al);
        await upd(w?{ph:'end',alive:al,log,shot,win:w}:{ph:'talk',alive:al,log,shot,...tp(R,al,R.muted,now)})}}
    else if(R.ph==='vote'){
      const st=R.vstage,cands=R.cands||A,vs=A.map(i=>getAct(i,st).vote).filter(v=>v&&cands.includes(v));
      if(A.every(i=>getAct(i,st).vote)||now>=R.until){
        done=key;const tp=plur(vs),vn=R.vn||0;
        if(tp.length===0)await finishVote(R,null,now);
        else if(tp.length>1){if(vn<3)await upd({vstage:'v'+rd+'_'+(vn+1),vn:vn+1,cands:tp,until:now+NIGHT});else await finishVote(R,null,now)}
        else if(vn>0&&tp[0]===R.prev)await finishVote(R,tp[0],now);
        else await upd({ph:'defend',acc:tp[0],until:now+120000});
      }}
    else if(R.ph==='defend'&&now>=R.until){done=key;await finishVote(R,R.acc,now)}
    else if(R.ph==='result'&&now>=R.until){done=key;await upd({ph:'night1',round:rd+1,start:now,until:now+NIGHT,elim:null,shot:null,died:null,muted:null})}
  }catch(e){done=''}
  finally{busy=false}
}

  else if(R.ph==='roles'){
    const mates=isM(me)?ids(R).filter(i=>isM(R.roles[i])&&i!==uid):[];
    h=`<h2>كرتك السري 🤫</h2>${card(me)}<p class="c dim">${ROLE[me].d}</p>${mates.length?`<p class="red c">شركاؤك في المافيا:<br>${mates.map(i=>chip(i)+' ('+ROLE[R.roles[i]].n+')').join('<br>')}</p>`:''}<p class="c dim">تبدأ الجولة الأولى بعد:</p>${timer(R.until)}`;
  }
  else if(R.ph==='end')h=end(R);
  else if(R.ph==='boy'&&uid===R.died)h=boyV(R);
  else if(!isA)h=ghost(R);
  else if(R.ph==='talk')h=talk(R);
  else if(R.ph==='night1')h=night1(R);
  else if(R.ph==='night2')h=night2(R);
  else if(R.ph==='dawn')h=dawnV(R);
  else if(R.ph==='boy')h=boyV(R);
  else if(R.ph==='vote')h=vote(R);
  else if(R.ph==='defend')h=defend(R);
  else if(R.ph==='result')h=result(R);
  if(R.ph!=='end'&&R.ph!=='lobby')h+=`<p class="c dim" style="font-size:13px">كرتك: ${ROLE[me]?ROLE[me].n:''} · <button onclick="leave()" style="font-size:12px;padding:4px 8px">خروج</button></p>`;
  if(R.ph==='lobby')h+=`<p class="c"><button onclick="leave()" style="font-size:13px">خروج</button></p>`;
  app.innerHTML=h;chatState();clock();
}
Object.assign(window,{again,endRoom,G,render,go,create,joinRoom,resume,revote,pickT,startGame,upd,leave});
init();
</script>
